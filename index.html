```html<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TECHBUG - Loading</title><style>* {    margin: 0;    padding: 0;    box-sizing: border-box;}body {    width: 100%;    height: 100vh;    overflow: hidden;    font-family: Arial, Helvetica, sans-serif;    background: #080b10;    color: white;}/* LOADING SCREEN */#loadingScreen {    position: fixed;    inset: 0;    background:        radial-gradient(circle at center, #18202b 0%, #080b10 65%);    display: flex;    justify-content: center;    align-items: center;    flex-direction: column;    z-index: 999;}/* Tech grid */#loadingScreen::before {    content: "";    position: absolute;    inset: 0;    background-image:        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);    background-size: 35px 35px;}/* Logo */.logo {    position: relative;    font-size: clamp(42px, 9vw, 85px);    font-weight: 900;    letter-spacing: 10px;    color: #ffffff;    text-shadow:        0 0 8px rgba(255,255,255,0.7),        0 0 25px rgba(0,200,255,0.5);    animation: pulse 1.5s infinite alternate;}.logo span {    color: #00d9ff;}/* Subtitle */.subtitle {    position: relative;    margin-top: 12px;    font-size: 13px;    letter-spacing: 5px;    color: #8793a3;}/* Loader */.loaderBox {    position: relative;    width: min(330px, 75%);    margin-top: 45px;}.loader {    height: 4px;    width: 100%;    background: #202733;    border-radius: 10px;    overflow: hidden;}.progress {    height: 100%;    width: 0%;    background: linear-gradient(90deg, #00d9ff, #ffffff);    box-shadow: 0 0 15px #00d9ff;    animation: load 4s linear forwards;}.status {    display: flex;    justify-content: space-between;    margin-top: 12px;    font-size: 11px;    letter-spacing: 2px;    color: #687585;}#percent {    color: #00d9ff;}/* HOME SCREEN */#homeScreen {    display: none;    height: 100vh;    justify-content: center;    align-items: center;    text-align: center;    background: #080b10;}.homeContent h1 {    font-size: clamp(40px, 8vw, 80px);    letter-spacing: 8px;}.homeContent h1 span {    color: #00d9ff;}.homeContent p {    margin-top: 15px;    color: #8995a5;    letter-spacing: 3px;}/* Animations */@keyframes load {    from {        width: 0%;    }    to {        width: 100%;    }}@keyframes pulse {    from {        transform: scale(1);        opacity: 0.85;    }    to {        transform: scale(1.03);        opacity: 1;    }}</style></head><body><!-- LOADING PAGE --><div id="loadingScreen">    <div class="logo">        TECH<span>BUG</span>    </div>    <div class="subtitle">        TECHNOLOGY • INNOVATION • FUTURE    </div>    <div class="loaderBox">        <div class="loader">            <div class="progress"></div>        </div>        <div class="status">            <span>INITIALIZING...</span>            <span id="percent">0%</span>        </div>    </div></div><!-- HOME PAGE --><div id="homeScreen">    <div class="homeContent">        <h1>TECH<span>BUG</span></h1>        <p>WELCOME TO THE FUTURE</p>    </div></div><script>let startTime = Date.now();let duration = 4000;let percent = document.getElementById("percent");let counter = setInterval(function() {    let elapsed = Date.now() - startTime;    let progress = Math.min((elapsed / duration) * 100, 100);    percent.innerText = Math.floor(progress) + "%";    if (progress >= 100) {        clearInterval(counter);        document.getElementById("loadingScreen").style.display = "none";        document.getElementById("homeScreen").style.display = "flex";    }}, 20);</script></body></html>```
